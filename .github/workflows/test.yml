name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The project has no dependencies on purpose, so there is nothing to
      # install: the tests run on the standard library of Node alone.
      - name: Run the tests
        run: node --test
